# Builds everything this repository publishes, then deploys it to Pages.
#
# The PDFs are not in git — they are compiled here, so the site is always
# serving the current résumé rather than whatever was last committed. resume.json
# is extracted from the same resume.tex in the same job, which is what
# telaak.dev renders its Résumé section from.
#
# Order matters: nothing is uploaded until the PDFs and the JSON exist.
#
# Nothing here notifies telaak.dev. Triggering a build in another repository
# needs a credential with write access, and that was not worth it for a file
# that changes a few times a year — that site polls hourly instead, and skips
# in seconds unless resume.json is newer than its last deploy.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume.tex
            cv.tex

      - name: Extract resume.json from resume.tex
        uses: The1TrueJoe/resume-tex-action@v1
        with:
          file: resume.tex
          output: resume.json

      # If any of these are missing the deploy would silently publish a 404, so
      # fail here instead.
      - name: Check the build produced what Pages is meant to serve
        run: |
          for file in resume.pdf cv.pdf resume.json; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty after the build"
              exit 1
            fi
            printf '%-14s %s bytes\n' "$file" "$(wc -c < "$file")"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # telaak.dev renders its Résumé section from the resume.json this workflow
  # just published, so it is told to rebuild — but only once that file is
  # actually live, which is why this needs `deploy` rather than running beside
  # it.
  #
  # The trigger is a force-pushed annotated tag rather than an API call: a
  # deploy key can push over SSH but cannot authenticate against the REST API,
  # and unlike a token it never expires. A tag is a ref, not a commit, so
  # nothing is added to that repository's history. It has to be *annotated* —
  # a lightweight tag pointing where it already pointed is a no-op, and no push
  # event would fire.
  #
  # Setup: SITE_DEPLOY_KEY holds the private half of a keypair whose public half
  # is a write-enabled deploy key on The1TrueJoe/The1TrueJoe.github.io. Without
  # the secret this job says so and stops; the site can still be rebuilt by hand
  # from its Actions tab.
  publish:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Tell telaak.dev to rebuild
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_REPO: git@github.com:The1TrueJoe/The1TrueJoe.github.io.git
        run: |
          set -euo pipefail

          if [ -z "${SITE_DEPLOY_KEY:-}" ]; then
            echo "::notice::SITE_DEPLOY_KEY is not set, so telaak.dev was not rebuilt."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 --quiet "$SITE_REPO" site
          cd site

          # Identity for the tag object itself. No commit is created.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f -a resume-latest -m "résumé published $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f --quiet origin resume-latest
          echo "pushed resume-latest -> $(git rev-parse --short HEAD)"
