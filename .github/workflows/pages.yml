# Builds everything this repository publishes, then deploys it to Pages.
#
# The PDFs are not in git — they are compiled here, so the site is always
# serving the current résumé rather than whatever was last committed. resume.json
# is extracted from the same resume.tex in the same job, which is what
# telaak.dev renders its Résumé section from.
#
# Order matters: nothing is uploaded until the PDFs and the JSON exist.
#
# Nothing here notifies telaak.dev. Triggering a build in another repository
# needs a credential with write access, and that was not worth it for a file
# that changes a few times a year — that site polls hourly instead, and skips
# in seconds unless resume.json is newer than its last deploy.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume.tex
            cv.tex

      - name: Extract resume.json from resume.tex
        uses: The1TrueJoe/resume-tex-action@v1
        with:
          file: resume.tex
          output: resume.json

      # If any of these are missing the deploy would silently publish a 404, so
      # fail here instead.
      - name: Check the build produced what Pages is meant to serve
        run: |
          for file in resume.pdf cv.pdf resume.json; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty after the build"
              exit 1
            fi
            printf '%-14s %s bytes\n' "$file" "$(wc -c < "$file")"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
